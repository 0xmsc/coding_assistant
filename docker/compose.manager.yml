name: coding-assistant-dev

services:
  manager:
    image: coding-assistant:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ../src
        - action: rebuild
          path: ../pyproject.toml
        - action: rebuild
          path: ../uv.lock
        - action: rebuild
          path: ../README.md
        - action: rebuild
          path: ./Dockerfile
    group_add:
      - "${CODING_ASSISTANT_DOCKER_SOCKET_GID}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CODING_ASSISTANT_HOST_DATA_DIR:?set CODING_ASSISTANT_HOST_DATA_DIR}:/data
    ports:
      - "127.0.0.1:8764:8764"
    environment:
      CODING_ASSISTANT_MANAGER_AUTH_SECRET: ${CODING_ASSISTANT_MANAGER_AUTH_SECRET:?set CODING_ASSISTANT_MANAGER_AUTH_SECRET}
      CODING_ASSISTANT_MODEL: gpt-5.1-codex-mini
      CODING_ASSISTANT_HOST_DATA_DIR: ${CODING_ASSISTANT_HOST_DATA_DIR:?set CODING_ASSISTANT_HOST_DATA_DIR}
      CODING_ASSISTANT_WORKER_IMAGE: coding-assistant:dev
      CODING_ASSISTANT_WORKER_NETWORK: coding-assistant-dev
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}

networks:
  default:
    name: coding-assistant-dev
